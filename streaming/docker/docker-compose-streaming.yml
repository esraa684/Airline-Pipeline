services:

  # =========================================================
  # 1. KAFKA - 3 BROKER KRaft CLUSTER
  # =========================================================

  kafka-controller-1:
    image: apache/kafka:4.1.0
    container_name: airline-kafka-controller-1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      CLUSTER_ID: "airline-kafka-cluster"
      KAFKA_PROCESS_ROLES: "controller"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-controller-1:9093,2@kafka-controller-2:9093,3@kafka-controller-3:9093"

      KAFKA_LISTENERS: "CONTROLLER://:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT"


  kafka-controller-2:
    image: apache/kafka:4.1.0
    container_name: airline-kafka-controller-2
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "2"
      CLUSTER_ID: "airline-kafka-cluster"
      KAFKA_PROCESS_ROLES: "controller"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-controller-1:9093,2@kafka-controller-2:9093,3@kafka-controller-3:9093"

      KAFKA_LISTENERS: "CONTROLLER://:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT"


  kafka-controller-3:
    image: apache/kafka:4.1.0
    container_name: airline-kafka-controller-3
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "3"
      CLUSTER_ID: "airline-kafka-cluster"
      KAFKA_PROCESS_ROLES: "controller"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-controller-1:9093,2@kafka-controller-2:9093,3@kafka-controller-3:9093"

      KAFKA_LISTENERS: "CONTROLLER://:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT"


  kafka-broker-1:
    image: apache/kafka:4.1.0
    container_name: airline-kafka-broker-1
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "4"
      CLUSTER_ID: "airline-kafka-cluster"
      KAFKA_PROCESS_ROLES: "broker"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-controller-1:9093,2@kafka-controller-2:9093,3@kafka-controller-3:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_LISTENERS: "INTERNAL://:19092,EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-broker-1:19092,EXTERNAL://localhost:9092"

      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_MIN_INSYNC_REPLICAS: "2"

    depends_on:
      - kafka-controller-1
      - kafka-controller-2
      - kafka-controller-3


  kafka-broker-2:
    image: apache/kafka:4.1.0
    container_name: airline-kafka-broker-2
    restart: unless-stopped
    ports:
      - "9093:9092"
    environment:
      KAFKA_NODE_ID: "5"
      CLUSTER_ID: "airline-kafka-cluster"
      KAFKA_PROCESS_ROLES: "broker"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-controller-1:9093,2@kafka-controller-2:9093,3@kafka-controller-3:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_LISTENERS: "INTERNAL://:19092,EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-broker-2:19092,EXTERNAL://localhost:9093"

      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_MIN_INSYNC_REPLICAS: "2"

    depends_on:
      - kafka-controller-1
      - kafka-controller-2
      - kafka-controller-3


  kafka-broker-3:
    image: apache/kafka:4.1.0
    container_name: airline-kafka-broker-3
    restart: unless-stopped
    ports:
      - "9094:9092"
    environment:
      KAFKA_NODE_ID: "6"
      CLUSTER_ID: "airline-kafka-cluster"
      KAFKA_PROCESS_ROLES: "broker"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-controller-1:9093,2@kafka-controller-2:9093,3@kafka-controller-3:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_LISTENERS: "INTERNAL://:19092,EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-broker-3:19092,EXTERNAL://localhost:9094"

      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_MIN_INSYNC_REPLICAS: "2"

    depends_on:
      - kafka-controller-1
      - kafka-controller-2
      - kafka-controller-3


  # =========================================================
  # 2. SPARK - MASTER + 2 WORKERS
  # =========================================================

  spark-master:
    image: apache/spark:4.2.0
    container_name: airline-spark-master
    restart: unless-stopped
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./src:/opt/spark-apps


  spark-worker-1:
    image: apache/spark:4.2.0
    container_name: airline-spark-worker-1
    restart: unless-stopped
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker --cores 2 --memory 2G spark://spark-master:7077
    volumes:
      - ./src:/opt/spark-apps


  spark-worker-2:
    image: apache/spark:4.2.0
    container_name: airline-spark-worker-2
    restart: unless-stopped
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker --cores 2 --memory 2G spark://spark-master:7077
    volumes:
      - ./src:/opt/spark-apps


  # =========================================================
  # 3. HDFS
  # =========================================================

  namenode:
    image: apache/hadoop:3.3.6
    container_name: airline-namenode
    hostname: namenode
    restart: unless-stopped
    ports:
      - "9870:9870"
      - "9001:9000"
    environment:
      CORE-SITE.XML_fs.defaultFS: hdfs://namenode:9000
      HDFS-SITE.XML_dfs.replication: "1"
      HDFS-SITE.XML_dfs.namenode.rpc-address: namenode:9000
      HDFS-SITE.XML_dfs.permissions: "false"
    volumes:
      - namenode_data:/tmp/hadoop-hadoop/dfs/name
    command: ["hdfs", "namenode"]


  datanode:
    image: apache/hadoop:3.3.6
    container_name: airline-datanode
    hostname: datanode
    restart: unless-stopped
    depends_on:
      - namenode
    environment:
      CORE-SITE.XML_fs.defaultFS: hdfs://namenode:9000
      HDFS-SITE.XML_dfs.replication: "1"
    volumes:
      - datanode_data:/tmp/hadoop-hadoop/dfs/data
    command: ["hdfs", "datanode"]


  # =========================================================
  # 4. CLICKHOUSE
  # =========================================================

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: airline-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/users.xml:ro


  # =========================================================
  # 5. GRAFANA
  # =========================================================

  grafana:
    image: grafana/grafana:latest
    container_name: airline-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - clickhouse
    volumes:
      - grafana_data:/var/lib/grafana


# =========================================================
# VOLUMES
# =========================================================

volumes:
  clickhouse_data:
  namenode_data:
  datanode_data:
  grafana_data: